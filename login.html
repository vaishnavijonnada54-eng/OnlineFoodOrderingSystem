<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UFT-8">
        <meta name="viewpoint" content="=width=device-width ,initial-scale=1.0">
        <title>Login page</title>
        <link rel="stylesheet" href="login.css">
    </head>
    <body>
        <nav class="navigation">
        <div class="logo">FoodExpress</div>
        <ul class="navlinks">
        </ul>
    </nav>
        <div class="logincontainer">
            <div class="loginheader">
            <h2 class="wel">Hi Welcome Back!</h2>
            <div class="header1">
            <p class="log"></p>
            </div>
            </div>
            <form action="/login" method="POST">
                <div class="mb-3">
                    <label for="email" class="form-label" >Email Address</label><br><br>
                   <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                </div><br>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label><br><br>
                  <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                  </div>
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="remember">
                        <label for="remember" class="form-check-label"> Remember me</label>
                         <a href="#" class="text-declaration-none"  style="color: #667eea; font-size:0.9rem;">Forget password</a>
                    </div>
                </div><br>
               <button type="submit" class="btn-login">Login</button>
            </form>
            <div class="divider">
                <span>or</span>
            </div>
            <div class="row g-2">
                <div class="col-6">
                <button class="btn-g"><img src="https://cdn-icons-png.flaticon.com/512/300/300221.png" 
       width="18" style="vertical-align: middle;">   Continue With Google   </button>
                </div>
            </div>
            <p class="text center mt-4 mb-0" style="font-size: 0.9rem;">
                Don't have an account? <a href="login.html" class="text-declaration-none fw-medium" style="color: #667eea;">Sign up</a>
            </p>
        </div>
    </body>
</html>
